{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow-sm border">
  <h1 class="text-2xl font-bold mb-2">Join couple group</h1>
  <p class="text-sm text-slate-600 mb-4">You're about to join this couple group as the second member.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="bg-rose-600 text-white px-4 py-2 rounded font-semibold hover:bg-rose-700">Confirm join</button>
  </form>
</div>
{% endblock %}
